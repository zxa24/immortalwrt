name: build xr1710g (immortalwrt)

# 官方 ImmortalWrt 树 + 移植进来的 xr1710g 设备支持。
# 干净一致基线,无第三方定制包;econet board 名已写进 an7581.mk 的 SUPPORTED_DEVICES。

on:
  workflow_dispatch:
    inputs:
      device:
        description: 设备
        required: true
        type: choice
        default: gemtek_xr1710g-ubi
        options:
          - gemtek_xr1710g-ubi
          - gemtek_w1700k-ubi
      docker:
        description: 编入 Docker(dockerd + docker CLI + dockerman 面板)
        required: false
        type: boolean
        default: false
      proxy:
        description: 编入代理栈(sing-box + kmod + jq) —— 自编固件事后装不了,必须烤进镜像
        required: false
        type: boolean
        default: false
      overlay:
        description: files/ 覆盖层 —— xr1=全量(默认,保持现状) / common=仅设备中立件 / none=不烤
        required: false
        type: choice
        default: xr1
        options:
          - xr1
          - common
          - none

concurrency:
  group: build-xr1710g-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      DEVICE: ${{ inputs.device }}
      DOCKER: ${{ inputs.docker }}
      PROXY: ${{ inputs.proxy }}
      OVERLAY: ${{ inputs.overlay }}
      DL_DIR: ${{ github.workspace }}/dl
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          set -uxo pipefail
          echo "==== 清理前 ===="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "==== 清理后 ===="; df -h /

      - name: 修复脚本权限
        run: |
          set -euxo pipefail
          find scripts -type f -exec chmod +x {} +
          chmod +x config/check-*.sh 2>/dev/null || true

      - name: 安装依赖
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison ccache clang curl fastjar flex gawk gettext \
            git gcc-multilib g++-multilib libelf-dev libncurses5-dev libssl-dev \
            libpython3-dev patch pkg-config python3 python3-distutils python3-pip \
            python3-setuptools qemu-utils rsync subversion swig unzip vim wget \
            xsltproc zlib1g-dev zstd
          python3 -m pip install --upgrade pip
          python3 -m pip install pyelftools

      - name: 缓存下载与 ccache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: ${{ runner.os }}-iw-${{ inputs.device }}-${{ hashFiles('feeds.conf.default', 'target/linux/airoha/**') }}
          restore-keys: |
            ${{ runner.os }}-iw-${{ inputs.device }}-

      - name: 更新 feeds
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          set -euxo pipefail
          # OpenWrt 设备 kconfig 符号保留连字符,直接用 $DEVICE(勿把 -ubi 的连字符换成下划线)
          printf '%s\n' \
            'CONFIG_TARGET_airoha=y' \
            'CONFIG_TARGET_airoha_an7581=y' \
            "CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE}=y" \
            'CONFIG_CCACHE=y' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' > .config
          # 可选:编入 Docker(workflow_dispatch 勾选 docker 时)
          if [ "${DOCKER:-false}" = "true" ]; then
            echo "==== 编入 Docker 包 ===="
            printf '%s\n' \
              'CONFIG_PACKAGE_dockerd=y' \
              'CONFIG_PACKAGE_docker=y' \
              'CONFIG_PACKAGE_luci-app-dockerman=y' \
              'CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y' >> .config
          fi
          # 代理栈:自编固件的内核 vermagic 与官方 snapshot 源不匹配,sing-box 依赖的
          # kmod-inet-diag / kmod-netlink-diag 在源里是 "no such package",
          # 事后 apk 装这条路是堵死的 —— 必须在这里编进去。(2026-08-22 xr1-cn 实测)
          if [ "${PROXY:-false}" = "true" ]; then
            echo "==== 编入代理栈 ===="
            {
              echo 'CONFIG_PACKAGE_sing-box=y'
              echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y'
              echo 'CONFIG_PACKAGE_jq=y'
            } >> .config
          fi
          make defconfig
          echo "==== 确认 luci 进入配置 ===="
          grep -E "^CONFIG_PACKAGE_luci=y" .config || { echo "!! luci 未选中"; exit 1; }
          if [ "${DOCKER:-false}" = "true" ]; then
            echo "==== 确认 dockerd 进入配置(defconfig 可能因依赖缺失静默丢包) ===="
            grep -E "^CONFIG_PACKAGE_dockerd=y" .config || { echo "!! dockerd 未选中"; exit 1; }
          fi
          if [ "${PROXY:-false}" = "true" ]; then
            echo "==== 确认代理栈进入配置(defconfig 可能因依赖缺失静默丢包) ===="
            grep -E "^CONFIG_PACKAGE_sing-box=y" .config || { echo "!! sing-box 未选中"; exit 1; }
            grep -E "^CONFIG_PACKAGE_kmod-inet-diag=y" .config || { echo "!! kmod-inet-diag 未被依赖拉入"; exit 1; }
          fi
          echo "==== 确认设备被选中(找不到就 dump 所有 DEVICE 符号供诊断) ===="
          grep "^CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "!! 未选中 $DEVICE,现有 DEVICE 符号如下:"; grep -E "CONFIG_TARGET_airoha_an7581_DEVICE_" .config; exit 1; }

      - name: 裁剪 files/ 覆盖层(按设备)
        run: |
          set -euo pipefail
          # buildroot 会**无条件**把仓库根的 files/ 复制进 rootfs,而本 workflow 此前完全没引用它。
          # 这个 overlay 是给 xr1 写的:里面的脚本写死了 xr1 的接口名(ivpn_*)与网段(192.168.1.0/24)。
          # 拿本 workflow 编"干净底包"给别的设备时,那些东西会**静默**跟着烤进去 —— 已实证多次
          # (xr1-cn 刷完后 /etc/rc.local 带着 096 迁移前的网段;/usr/sbin/wg-failover-watchdog
          #  在遍历本机根本不存在的接口)。
          #
          # 这一步把"烤什么"变成显式选择,并把最终清单**全量打印**:既不静默裁剪,也不静默全量。
          OV="${OVERLAY:-xr1}"
          if [ ! -d files ]; then
            echo "仓库根没有 files/ —— 无覆盖层可烤"
            exit 0
          fi

          # xr1 专属:写死了该机的接口名/网段/服务 ⇒ 烤到别的设备上是死码或误配
          XR1_ONLY="files/usr/sbin/wg-failover-watchdog files/etc/hotplug.d/iface files/etc/rc.local files/etc/uci-defaults"
          # 设备中立:同型号硬件都适用,且不含任何站点/网络配置
          COMMON_RE='^(files/README\.md|files/lib/|files/etc/hotplug\.d/net/|files/www/)'

          case "$OV" in
            xr1)
              echo "==== overlay=xr1:全量烤入(与历史行为一致) ===="
              ;;
            common)
              echo "==== overlay=common:剔除 xr1 专属件 ===="
              for p in $XR1_ONLY; do
                if [ -e "$p" ]; then rm -rf "$p"; echo "  剔除 $p"; fi
              done
              # 反向校验:剔除后若还剩下不属于"设备中立"清单的文件,说明 files/ 里加了新东西
              # 而本步骤的分类清单没跟上 ⇒ **显式失败**,而不是把未知文件静默烤进去。
              LEFT="$(find files -type f | grep -vE "$COMMON_RE" || true)"
              if [ -n "$LEFT" ]; then
                echo "!! 剔除后仍有不在设备中立清单里的文件:"
                echo "$LEFT" | sed 's/^/    /'
                echo "!! files/ 有新增件而本步骤的分类清单未更新 —— 请先判定它属于哪一类再重跑"
                exit 1
              fi
              ;;
            none)
              echo "==== overlay=none:整个 files/ 不烤 ===="
              rm -rf files
              ;;
            *)
              echo "!! 未知 overlay 值:$OV"; exit 1
              ;;
          esac

          echo "==== 实际会被烤进 rootfs 的文件(全量列出,不截断) ===="
          if [ -d files ]; then
            find files -type f | sort | sed 's/^/  /'
            echo "  共 $(find files -type f | wc -l) 个文件"
          else
            echo "  (无)"
          fi

      - name: 下载源码
        run: |
          set -euxo pipefail
          make download -j"$(nproc)"

      - name: 编译固件
        run: |
          set -uxo pipefail
          make -j"$(nproc)" || {
            echo "==== 并行失败,回退 -j1 V=s 定位真因 ===="
            make -j1 V=s
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.device }}
          path: |
            bin/targets/airoha/an7581/**
          if-no-files-found: error
          retention-days: 30
